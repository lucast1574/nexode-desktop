[package]
name = "nexode-todo-policy"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure todo quality-gate and auto-poke policy shared by Nexode clients"

[dependencies]
nexode-task-types = { path = "../nexode-task-types" }
nexode-storage = { path = "../nexode-storage" }
nexode-logging = { path = "../nexode-logging" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
nexode-core = { path = "../nexode-core" }
