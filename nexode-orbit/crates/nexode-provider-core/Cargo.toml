[package]
name = "nexode-provider-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "nexode_provider_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
flate2 = "1"
# Request-body compression for api.openai.com, which accepts only identity or
# zstd. Default features off: we only need the bulk encoder.
zstd = { version = "0.14", default-features = false }
futures = "0.3"
httpdate = "1"
nexode-logging = { path = "../nexode-logging" }
nexode-schema-dialect = { path = "../nexode-schema-dialect" }
nexode-message-types = { path = "../nexode-message-types" }
nexode-usage-types = { path = "../nexode-usage-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9.3"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time", "macros", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false }
