[package]
name = "nexode-provider-doctor"
version = "0.1.0"
edition = "2024"
publish = false

# Provider diagnostics that sit downstream of nexode-base: the strict
# `nexode provider-doctor` end-to-end runner (provider_e2e), the live provider
# probes it drives, and the auth-lifecycle contract driver. Split out of
# nexode-base so edits to the doctor cluster no longer rebuild the
# base -> app-core -> tui spine, and base compiles faster with lower peak
# memory.

[lib]
name = "nexode_provider_doctor"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

# default-features = false: the doctor only needs base's always-on surface
# (auth, provider runtimes, provider_catalog, live_tests). Feature unification
# in the root binary re-enables embeddings/bedrock there.
nexode-base = { path = "../nexode-base", default-features = false }
nexode-provider-gemini-runtime = { path = "../nexode-provider-gemini-runtime" }
nexode-provider-anthropic-runtime = { path = "../nexode-provider-anthropic-runtime" }
nexode-provider-openai-runtime = { path = "../nexode-provider-openai-runtime" }
nexode-provider-openrouter-runtime = { path = "../nexode-provider-openrouter-runtime" }
nexode-provider-cursor-runtime = { path = "../nexode-provider-cursor-runtime" }
nexode-provider-antigravity-runtime = { path = "../nexode-provider-antigravity-runtime" }
nexode-provider-copilot-runtime = { path = "../nexode-provider-copilot-runtime" }

[dev-dependencies]
# The auth-lifecycle driver tests run inside nexode-base's auth test sandbox.
nexode-base = { path = "../nexode-base", version = "0.1.0", default-features = false, features = ["test-support"] }
nexode-provider-metadata = { path = "../nexode-provider-metadata", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt"] }
