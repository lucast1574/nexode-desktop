[package]
name = "nexode-build-support"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
nexode-core = { path = "../nexode-core" }
nexode-selfdev-types = { path = "../nexode-selfdev-types" }
nexode-storage = { path = "../nexode-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
