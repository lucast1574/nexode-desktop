name: Announce release on Discord

env:
  NEXODE_CI: "1"

on:
  # Covers releases published outside the tag-driven release workflow. Events
  # created by GITHUB_TOKEN are suppressed, so release.yml also dispatches this
  # workflow explicitly after it publishes a release.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public release tag to announce
        required: true
        type: string

concurrency:
  group: discord-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  announce:
    # Same rule as `release.yml`: announcing is an outbound side effect, so it
    # belongs to the canonical repository. On a fork the webhook secret is
    # absent and the step would fail rather than post, but the guard makes that
    # independent of whether the fork happens to hold the secret.
    if: vars.NEXODE_RELEASE_REPO != '' && github.repository == vars.NEXODE_RELEASE_REPO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Post release notes to Discord if not already announced
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: cargo xtask post-discord-release --tag "$TAG"
