name: Native desktop
on:
  push:
    paths: ['nexode-orbit/**', 'src/**', 'assets/**', 'Cargo.*', 'build.rs', 'start.ps1', 'scripts/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['nexode-orbit/**', 'src/**', 'assets/**', 'Cargo.*', 'build.rs', 'start.ps1', 'scripts/**', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.5'
      CARGO_BUILD_RUSTC_WRAPPER: ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexode-desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev libwebkit2gtk-4.1-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nexode-desktop
            nexode-desktop/nexode-orbit
          cache-on-failure: true
      - name: Format
        working-directory: nexode-desktop
        run: cargo fmt --check
      - name: Test
        working-directory: nexode-desktop
        run: cargo test --locked
      - name: Clippy
        working-directory: nexode-desktop
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Engine SDK parity and monorepo discovery tests
        working-directory: nexode-desktop/nexode-orbit
        run: |
          cargo test --locked -p nexode-sdk parity
          cargo test --locked -p nexode-build-support paths::tests::find
          cargo test --locked -p nexode-build-support paths::tests::is_nexode_repo
      - name: Build desktop and engine from this checkout
        working-directory: nexode-desktop
        shell: bash
        run: bash scripts/build.sh
      - name: Bundle macOS application and engine
        if: runner.os == 'macOS'
        working-directory: nexode-desktop
        run: bash scripts/bundle-macos.sh
      - name: Bundle Windows application, engine and MCP
        if: runner.os == 'Windows'
        working-directory: nexode-desktop
        shell: pwsh
        run: ./scripts/bundle-windows.ps1 -DesktopBinary ./target/release/nexode-desktop.exe
      - uses: actions/upload-artifact@v4
        with:
          name: nexode-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            nexode-desktop/target/release/nexode-desktop
            nexode-desktop/target/release/nexode-desktop.exe
            nexode-desktop/dist/Nexode-Orbit-macOS-*.zip
            nexode-desktop/dist/Nexode-Orbit-Windows-x64.zip*
