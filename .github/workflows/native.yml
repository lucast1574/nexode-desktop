name: Native desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexode-desktop
      - uses: actions/checkout@v4
        with:
          repository: lucast1574/nexode-orbit
          ref: dc71ff1c41068b6eaf4ac3c1f7ca06c091203784
          path: nexode-orbit
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexode-desktop
      - name: Format
        working-directory: nexode-desktop
        run: cargo fmt --check
      - name: Test
        working-directory: nexode-desktop
        run: cargo test --locked
      - name: Clippy
        working-directory: nexode-desktop
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build native desktop
        working-directory: nexode-desktop
        run: cargo build --locked --release
      - name: Bundle macOS application and engine
        if: runner.os == 'macOS'
        working-directory: nexode-desktop
        run: bash scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nexode-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            nexode-desktop/target/release/nexode-desktop
            nexode-desktop/target/release/nexode-desktop.exe
            nexode-desktop/dist/Nexode-Orbit-macOS-*.zip
