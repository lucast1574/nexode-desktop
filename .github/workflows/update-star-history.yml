name: Update weekly stars chart

env:
  NEXODE_CI: "1"

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: true

jobs:
  update:
    if: vars.NEXODE_RELEASE_REPO != '' && github.repository == vars.NEXODE_RELEASE_REPO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate chart using repository-authorized star data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo xtask star-history
      - name: Commit updated chart
        run: |
          if git diff --quiet -- docs/images/star-history.svg; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/images/star-history.svg
          git commit -m "docs: update weekly stars chart"
          # Chart generation can take minutes while source commits advance master.
          # Preserve those commits rather than failing a non-fast-forward push.
          git pull --rebase
          git push
