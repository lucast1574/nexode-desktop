name: Update downloads badge

env:
  NEXODE_CI: "1"

on:
  schedule:
    - cron: "41 */6 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-downloads-badge
  cancel-in-progress: true

jobs:
  update:
    if: vars.NEXODE_RELEASE_REPO != '' && github.repository == vars.NEXODE_RELEASE_REPO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Count downloads across all releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo xtask downloads-badge
      - name: Commit updated badge
        run: |
          if git diff --quiet -- docs/badges/downloads.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/badges/downloads.json
          git commit -m "docs: update downloads badge"
          git pull --rebase
          git push
