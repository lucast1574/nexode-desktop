[package]
name = "nexode-provider-openrouter"
version = "0.1.0"
edition = "2024"

[dependencies]
nexode-schema-dialect = { path = "../nexode-schema-dialect" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
futures = "0.3"
nexode-core = { path = "../nexode-core" }
nexode-logging = { path = "../nexode-logging" }
nexode-message-types = { path = "../nexode-message-types" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
