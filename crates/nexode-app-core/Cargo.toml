[package]
name = "nexode-app-core"
version = "0.1.0"
edition = "2024"
publish = false

# Application core for nexode: all non-presentation modules (server, agent,
# provider, auth, session, tool, config, etc.) extracted out of the monolithic
# root `nexode` crate so they compile as a separate rustc unit. The root `nexode`
# crate (cli + tui + bin) re-exports this crate's modules via `pub use
# nexode_app_core::*`, preserving every existing `crate::<module>` path.

[lib]
name = "nexode_app_core"
path = "src/lib.rs"

[dependencies]
# NOTE: the jemalloc allocator stats live in `nexode-base` (process_memory) and
# local embeddings live in `nexode-base` (embedding); this crate forwards those
# features to nexode-base rather than depending on the backing crates directly.

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"

# CLI

# File operations
similar = "2"            # diffing for edits

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"        # URL encoding for web search
uuid = { version = "1", features = ["v4", "v5"] }
nexode-applet-types = { path = "../nexode-applet-types" }

# Embeddings (local inference) live in nexode-base; this crate forwards the
# `embeddings` feature to nexode-base rather than depending on nexode-embedding.
nexode-harness-api = { path = "../nexode-harness-api" }
nexode-productivity-core = { path = "../nexode-productivity-core" }
nexode-import-core = { path = "../nexode-import-core" }

# OAuth
base64 = "0.22"
sha2 = "0.10"
rand = "0.9.3"
url = "2"
# Local fallback for the open tool when no `nexode companion` is running.
nexode-desktop-open = { path = "../nexode-desktop-open" }
nexode-agent-runtime = { path = "../nexode-agent-runtime" }
nexode-ambient-types = { path = "../nexode-ambient-types" }
nexode-notify-email = { path = "../nexode-notify-email" }
nexode-provider-core = { path = "../nexode-provider-core" }
nexode-schema-dialect = { path = "../nexode-schema-dialect" }
# NOTE: nexode-app-core does NOT depend on any nexode-tui-* crate. They were
# unused dead dependency edges here (the TUI declares them itself). Removing
# them stops a nexode-tui-* edit from cascading a recompile through app-core.
nexode-update-core = { path = "../nexode-update-core" }

# Streaming
tokio-stream = "0.1"

# NOTE: no ratatui/crossterm here. Terminal rendering and prompts belong to the
# CLI and nexode-tui, so the shared runtime never touches a terminal.

# PDF parsing (behind feature flag)
nexode-pdf = { path = "../nexode-pdf", optional = true }
nexode-build-support = { path = "../nexode-build-support" }
nexode-build-meta = { path = "../nexode-build-meta" }

# Foundational layer (provider, auth, config, session, message, memory, ...).
# Re-exported via `pub use nexode_base::*` in lib.rs. default-features=false so
# this crate controls nexode-base's optional features (see [features] below).
nexode-base = { path = "../nexode-base", default-features = false }
nexode-command-risk = { path = "../nexode-command-risk" }
nexode-core = { path = "../nexode-core" }
nexode-message-types = { path = "../nexode-message-types" }
nexode-overnight-core = { path = "../nexode-overnight-core" }
nexode-plan = { path = "../nexode-plan" }
nexode-swarm-core = { path = "../nexode-swarm-core" }
nexode-selfdev-types = { path = "../nexode-selfdev-types" }
nexode-session-types = { path = "../nexode-session-types" }
nexode-setup-hints = { path = "../nexode-setup-hints" }
nexode-task-types = { path = "../nexode-task-types" }
nexode-tool-core = { path = "../nexode-tool-core" }
nexode-codemode = { path = "../nexode-codemode" }
nexode-tool-types = { path = "../nexode-tool-types" }

# Archive extraction (for auto-update)
flate2 = "1"
tar = "0.4"
tempfile = "3"
agentgrep = { git = "https://github.com/1jehuang/agentgrep.git", tag = "v0.2.0" }

[features]
default = ["pdf", "bedrock"]
# jemalloc allocator stats live in nexode-base (process_memory); forward there.
jemalloc = ["nexode-base/jemalloc"]
jemalloc-prof = ["nexode-base/jemalloc-prof"]
# local embeddings live in nexode-base (embedding); forward there.
embeddings = ["nexode-base/embeddings"]
# live AWS Bedrock support lives in nexode-base (provider/bedrock); forward there.
bedrock = ["nexode-base/bedrock"]
# Used only by the CentOS 7 portable Linux release build.
linux-compat-vendored-openssl = ["nexode-notify-email/linux-compat-vendored-openssl"]
# PDF text extraction lives in this crate (tool/read.rs).
pdf = ["dep:nexode-pdf"]
# Compiles this crate's test-only helpers/accessors (e.g. the
# ExternalAuthReviewCandidate read accessors) as `pub` and forwards
# nexode-base's `test-support` so downstream crates' test targets can reach the
# whole stack's helpers. Never enabled in normal (non-test) builds.
test-support = ["nexode-base/test-support"]

[dev-dependencies]
# The application consumes a corpus registered by the executable. Only its
# own documentation tests need to embed the real corpus directly.
nexode-docs-data = { path = "../nexode-docs-data" }
# Paused-time browser tests must compile when this package is tested alone,
# without inheriting test-util from another workspace package's dev-dependencies.
tokio = { version = "1", features = ["test-util"] }
# Used by async streaming tests (ambient/runner_tests, server/client_actions_tests).
async-stream = "0.3"
# Enables nexode-base's test-support helpers (storage::lock_test_env,
# auth::test_sandbox, bus::reset_models_updated_publish_state_for_tests) for
# *this* crate's own test target. Feature unification applies this only to
# test/bench/example builds, not to a normal `cargo build`.
nexode-base = { path = "../nexode-base", default-features = false, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"
# Native desktop control for the `macos_computer_use` tool (synthetic mouse/keyboard
# events, cursor positioning, display bounds). `highsierra` enables the
# CGEventCreateScrollWheelEvent2 binding used for scroll.
core-graphics = { version = "0.23", features = ["highsierra"] }
