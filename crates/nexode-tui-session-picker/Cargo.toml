[package]
name = "nexode-tui-session-picker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
nexode-message-types = { path = "../nexode-message-types" }
nexode-session-types = { path = "../nexode-session-types" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
