[package]
name = "nexode-harness-api-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Harness API endpoint: bridges versioned API clients onto the internal nexode protocol"

[dependencies]
anyhow = "1"
nexode-harness-api = { path = "../nexode-harness-api" }
nexode-todo-policy = { path = "../nexode-todo-policy" }
nexode-session-types = { path = "../nexode-session-types" }
nexode-transport = { path = "../nexode-transport" }
serde = "1"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["net", "io-util", "io-std", "rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The parser in `background_progress` reads markdown produced by the daemon's
# own formatter, so the contract test builds that formatter rather than a copy
# of its output: a change to the wire prose then fails here instead of silently
# turning every client's progress bar off. Dev-only, so the bridge binary stays
# free of the application foundation.
nexode-base = { path = "../nexode-base", default-features = false }
nexode-background-types = { path = "../nexode-background-types" }

[[bin]]
name = "nexode-harness-api-bridge"
path = "src/bin/bridge.rs"
