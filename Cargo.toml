[package]
name = "nexode-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Native GPU-rendered desktop workspace for Nexode Orbit"
license = "MIT"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "persistence"] }
egui_extras = { version = "0.33.3", default-features = false, features = ["svg", "image"] }
egui_commonmark = { version = "0.22", default-features = false, features = ["pulldown_cmark"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
zeroize = "1"
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
wry = "0.57.1"
raw-window-handle = "0.6"
tray-icon = { version = "0.21.3", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
nexode-sdk = { path = "nexode-orbit/crates/nexode-sdk" }

[profile.release]
lto = "thin"
strip = "debuginfo"

[dev-dependencies]
tempfile = "3"

[features]
screenshot = ["eframe/__screenshot"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }
